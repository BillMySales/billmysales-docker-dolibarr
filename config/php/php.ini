; PHP overrides. Values come from environment variables set in compose.yaml.
memory_limit = ${PHP_MEMORY_LIMIT}
upload_max_filesize = ${UPLOAD_MAX_SIZE}
post_max_size = ${UPLOAD_MAX_SIZE}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
date.timezone = ${PHP_TIMEZONE}
expose_php = Off
session.use_strict_mode = 1
; Functions Dolibarr's security page recommends disabling (as the vendor image does).
disable_functions = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_get_handler,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,pcntl_async_signals,passthru,shell_exec,system,proc_open,popen,dl,show_source,virtual
; Errors: never shown to visitors unless PHP_DISPLAY_ERRORS is on (development);
; always logged to stderr (docker compose logs). The official PHP image has no
; php.ini, and PHP's built-in default shows errors.
display_errors = ${PHP_DISPLAY_ERRORS}
display_startup_errors = ${PHP_DISPLAY_ERRORS}
log_errors = On
error_log = /dev/stderr
